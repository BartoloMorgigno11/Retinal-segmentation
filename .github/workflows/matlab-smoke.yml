name: MATLAB synthetic segmentation smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-segmentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up MATLAB and research toolboxes
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Image_Processing_Toolbox Statistics_and_Machine_Learning_Toolbox
          cache: true
      - name: Run algorithms on artificial images (no clinical data)
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); runSyntheticSmoke
